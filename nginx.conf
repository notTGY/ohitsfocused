root /usr/share/nginx/html;

 server {
   client_max_body_size 10M;
   gzip on;
  gzip_buffers 16 8k;
  gzip_comp_level 6;
  gzip_http_version 1.0;
  gzip_min_length 1280;
  gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/bmp image/webp application/javascript;
  gzip_vary on;

  listen 80;
  server_name example.com;

  index index.html;
  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
  location = /404.html { internal; }
}
